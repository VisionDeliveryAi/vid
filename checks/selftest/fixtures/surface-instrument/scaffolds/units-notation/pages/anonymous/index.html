<!-- rendered: GET / as anonymous (fixture data listed) — Design: design/screens/pack.html (P01/default) -->
<header data-screen-label="C00/shell-anonymous" data-element="shell-header" style="background-color: #FFF; padding: 16px 24px">
  <a data-element="brand" href="/" style="color: rgb(27, 27, 31); font-weight: 700">Boardlet</a>
  <nav data-element="primary-nav" style="display: flex; gap: 16px">
    <a href="/jobs">Jobs</a>
    <a href="/signin">Sign in</a>
  </nav>
</header>
<main data-screen-label="P01/default">
  <h1 data-element="page-title" style="font-size: 32px; color: rgb(27, 27, 31)">Find your next role</h1>
  <form data-element="search-form" action="/jobs" method="get" style="display: flex; gap: 8px">
    <input data-element="search-field" name="q" placeholder="Keyword" style="padding: 8px">
    <button data-element="search-action" type="submit" style="background-color: #0a5c36; color: white; padding: 0.5em 1em">Search</button>
  </form>
  <section data-element="featured-grid" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px">
    <article>Junior Analyst</article><article>Data Engineer</article><article>Office Manager</article>
  </section>
</main>
