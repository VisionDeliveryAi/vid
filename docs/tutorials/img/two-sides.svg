<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="The product side and the dev side, with GitHub between them">
<rect x="0" y="0" width="1000" height="350" fill="#f6f7f8"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#0b5c7a"/></marker></defs>
<text x="16" y="18" text-anchor="start" style="fill:#5a6875;font-size:11.5px;font-weight:400;font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace">THE PRODUCT SIDE: VID</text>
<line x1="16" y1="28" x2="316" y2="28" style="stroke:#16202a" stroke-width="1.5"/>
<text x="350" y="18" text-anchor="start" style="fill:#5a6875;font-size:11.5px;font-weight:400;font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace">GITHUB</text>
<line x1="350" y1="28" x2="650" y2="28" style="stroke:#16202a" stroke-width="1.5"/>
<text x="684" y="18" text-anchor="start" style="fill:#5a6875;font-size:11.5px;font-weight:400;font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace">THE DEV SIDE: YOUR TEAM</text>
<line x1="684" y1="28" x2="984" y2="28" style="stroke:#16202a" stroke-width="1.5"/>
<rect x="16" y="42" width="300" height="110" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="28" y="64" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">You, the team lead</text>
<text x="28" y="84" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Decide product questions.</text>
<text x="28" y="104" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Approve the spec and the plan.</text>
<text x="28" y="124" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Rule on what ViD brings you.</text>
<rect x="16" y="164" width="300" height="170" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="28" y="186" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">ViD, in a Claude Code session</text>
<text x="28" y="206" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Writes the spec with you.</text>
<text x="28" y="226" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Plans steps; writes tickets.</text>
<text x="28" y="246" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Reads results; decides each row.</text>
<text x="28" y="266" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Writes no code. Runs nothing.</text>
<rect x="350" y="42" width="300" height="110" rx="3" style="fill:#e2eff4;stroke:#0b5c7a" stroke-width="1"/>
<text x="362" y="64" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The spec repository (private)</text>
<text x="362" y="84" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The spec your developers read.</text>
<text x="362" y="104" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">ViD&#x27;s records: a repository of its own.</text>
<rect x="350" y="164" width="300" height="170" rx="3" style="fill:#e2eff4;stroke:#0b5c7a" stroke-width="1"/>
<text x="362" y="186" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The code repository (yours)</text>
<text x="362" y="206" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Issues: tickets and run requests.</text>
<text x="362" y="226" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Pull requests: the work.</text>
<text x="362" y="246" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Branches named vid-results/…: one report</text>
<text x="362" y="263" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">each.</text>
<text x="362" y="283" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Comments: claims, questions, decisions.</text>
<rect x="684" y="42" width="300" height="110" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="696" y="64" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Your developers</text>
<text x="696" y="84" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Write tests first; build; test.</text>
<text x="696" y="104" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Grade each other&#x27;s work, fresh.</text>
<text x="696" y="124" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Merge to main, then ask ViD.</text>
<rect x="684" y="164" width="300" height="170" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="696" y="186" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Your tools and your tests</text>
<text x="696" y="206" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Any language, any test runner, any</text>
<text x="696" y="223" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">coding assistant.</text>
<text x="696" y="243" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Your test environment.</text>
<text x="696" y="263" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Makes no product decision: it asks.</text>
<line x1="318" y1="96" x2="348" y2="96" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="652" y1="96" x2="682" y2="96" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="318" y1="210" x2="348" y2="210" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="652" y1="210" x2="682" y2="210" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="682" y1="290" x2="652" y2="290" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="348" y1="290" x2="318" y2="290" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>