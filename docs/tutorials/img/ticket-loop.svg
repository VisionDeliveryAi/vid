<rect x="664" y="392" width="320" height="48" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="674" y="411" text-anchor="start" style="fill:#0b5c7a;font-size:12px;font-weight:500;font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace">7</text>
<text x="698" y="411" text-anchor="start" style="fill:#16202a;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The team asks on the ticket for the</text>
