<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Three places: your machine, the test site, and live, with what you say and what is checked between them">
<rect x="0" y="0" width="1000" height="250" fill="#f6f7f8"/>
