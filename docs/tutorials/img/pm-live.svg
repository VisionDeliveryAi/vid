<text x="313.5" y="106" text-anchor="middle" style="fill:#16202a;font-size:12px;font-weight:400;font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace">&quot;deploy to staging&quot;</text>
<line x1="616" y1="86" x2="755" y2="86" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="685.5" y="74" text-anchor="middle" style="fill:#5a6875;font-size:11.5px;font-weight:400;font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace">you say</text>
