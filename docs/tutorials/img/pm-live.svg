<rect x="760" y="20" width="224" height="132" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="772" y="44" text-anchor="start" style="fill:#16202a;font-size:14.5px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Live</text>
<text x="772" y="66" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">In front of users.</text>
<text x="772" y="86" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Never without your yes.</text>
<line x1="244" y1="86" x2="383" y2="86" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
