<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Your work is at the start and at the end; ViD works in between">
<rect x="0" y="0" width="1000" height="300" fill="#f6f7f8"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#0b5c7a"/></marker></defs>
<text x="16" y="18" text-anchor="start" style="fill:#5a6875;font-size:11.5px;font-weight:400;font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace">YOU</text>
<line x1="16" y1="28" x2="984" y2="28" style="stroke:#16202a" stroke-width="1.5"/>
<text x="16" y="168" text-anchor="start" style="fill:#5a6875;font-size:11.5px;font-weight:400;font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace">VID</text>
<line x1="16" y1="178" x2="984" y2="178" style="stroke:#16202a" stroke-width="1.5"/>
<rect x="16" y="40" width="230" height="100" rx="3" style="fill:#e2eff4;stroke:#0b5c7a" stroke-width="1"/>
<text x="26" y="61" text-anchor="start" style="fill:#16202a;font-size:13.5px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Answer and approve</text>
<text x="26" y="80" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The interview. Three approvals</text>
<text x="26" y="96" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">of the requirements. The</text>
<text x="26" y="112" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">design.</text>
<rect x="16" y="190" width="230" height="96" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="26" y="211" text-anchor="start" style="fill:#16202a;font-size:13.5px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Writes the spec</text>
<text x="26" y="230" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Every requirement with its</text>
<text x="26" y="246" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">fail-if. Nothing is edited</text>
<text x="26" y="262" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">later, only added.</text>
<line x1="248" y1="238" x2="259" y2="238" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="131" y1="142" x2="131" y2="186" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#ah)"/>
<rect x="262" y="40" width="230" height="100" rx="3" style="fill:#e2eff4;stroke:#0b5c7a" stroke-width="1"/>
<text x="272" y="61" text-anchor="start" style="fill:#16202a;font-size:13.5px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Approve what is tested</text>
<text x="272" y="80" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The test inventory, as one</text>
<text x="272" y="96" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">table. The stage cut.</text>
<rect x="262" y="190" width="230" height="96" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="272" y="211" text-anchor="start" style="fill:#16202a;font-size:13.5px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Turns it into tests</text>
<text x="272" y="230" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Each one written first, and</text>
<text x="272" y="246" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">seen to fail.</text>
<line x1="494" y1="238" x2="505" y2="238" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="377" y1="142" x2="377" y2="186" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#ah)"/>
<rect x="508" y="40" width="230" height="100" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="518" y="61" text-anchor="start" style="fill:#16202a;font-size:13.5px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Answer a question</text>
<text x="518" y="80" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Only product questions reach</text>
<text x="518" y="96" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">you. The build goes on</text>
<text x="518" y="112" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">meanwhile.</text>
<rect x="508" y="190" width="230" height="96" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="518" y="211" text-anchor="start" style="fill:#16202a;font-size:13.5px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Builds until they pass</text>
<text x="518" y="230" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Stage by stage. No approvals,</text>
<text x="518" y="246" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">no checkpoints.</text>
<line x1="740" y1="238" x2="751" y2="238" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="623" y1="142" x2="623" y2="186" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#ah)"/>
<rect x="754" y="40" width="230" height="100" rx="3" style="fill:#e2eff4;stroke:#0b5c7a" stroke-width="1"/>
<text x="764" y="61" text-anchor="start" style="fill:#16202a;font-size:13.5px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Judge the result</text>
<text x="764" y="80" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Use it. Read the counts. Rule</text>
<text x="764" y="96" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">on each finding.</text>
<rect x="754" y="190" width="230" height="96" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="764" y="211" text-anchor="start" style="fill:#16202a;font-size:13.5px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Fresh readers check it</text>
<text x="764" y="230" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Against each fail-if. They try</text>
<text x="764" y="246" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">to break it.</text>
<line x1="869" y1="142" x2="869" y2="186" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#ah)"/>
</svg>