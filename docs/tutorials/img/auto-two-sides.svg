<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" width="1000" height="404" role="img" aria-label="GitHub auto: you and ViD on the product side, ViD's DevAgent on the other, GitHub between them, both sides on your machine">
<rect x="0" y="0" width="1000" height="404" fill="#f6f7f8"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#0b5c7a"/></marker></defs>
<text x="16" y="18" text-anchor="start" style="fill:#5a6875;font-size:11.5px;font-weight:400;font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace">THE PRODUCT SIDE: YOU AND VID</text><line x1="16" y1="28" x2="316" y2="28" style="stroke:#16202a" stroke-width="1.5"/>
<text x="350" y="18" text-anchor="start" style="fill:#5a6875;font-size:11.5px;font-weight:400;font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace">GITHUB</text><line x1="350" y1="28" x2="650" y2="28" style="stroke:#16202a" stroke-width="1.5"/>
<text x="684" y="18" text-anchor="start" style="fill:#5a6875;font-size:11.5px;font-weight:400;font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace">THE DEV SIDE: VID&#x27;S DEVAGENT</text><line x1="684" y1="28" x2="984" y2="28" style="stroke:#16202a" stroke-width="1.5"/>
<rect x="16" y="42" width="300" height="110" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="28" y="64" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">You</text>
<text x="28" y="84" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Decide product questions.</text>
<text x="28" y="104" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Approve the spec and the plan.</text>
<text x="28" y="124" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Rule on findings. Say yes to going live.</text>
<rect x="16" y="164" width="300" height="170" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="28" y="186" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">ViD, in a Claude Code session</text>
<text x="28" y="206" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Writes the spec with you.</text>
<text x="28" y="226" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Plans steps; writes tickets.</text>
<text x="28" y="246" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Reads results; decides each row.</text>
<text x="28" y="266" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Writes no code. Runs nothing.</text>
<rect x="350" y="42" width="300" height="110" rx="3" style="fill:#e2eff4;stroke:#0b5c7a" stroke-width="1"/>
<text x="362" y="64" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The spec repository (private)</text>
<text x="362" y="84" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The spec the dev side reads.</text>
<text x="362" y="104" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">ViD&#x27;s own records, on a branch.</text>
<rect x="350" y="164" width="300" height="170" rx="3" style="fill:#e2eff4;stroke:#0b5c7a" stroke-width="1"/>
<text x="362" y="186" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The code repository (private)</text>
<text x="362" y="206" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Issues: tickets, and requests for</text>
<text x="362" y="223" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">runs, a review, a deploy.</text>
<text x="362" y="243" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Pull requests: the work.</text>
<text x="362" y="263" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Branches named vid-results/…: one</text>
<text x="362" y="280" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">report each.</text>
<text x="362" y="300" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Comments: claims, questions,</text>
<text x="362" y="317" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">decisions.</text>
<rect x="684" y="42" width="300" height="110" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="696" y="64" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The loop, started by you</text>
<text x="696" y="84" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">From a conversation that follows it,</text>
<text x="696" y="101" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">or in the background.</text>
<text x="696" y="121" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Reads the repository once a minute.</text>
<rect x="684" y="164" width="300" height="170" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="696" y="186" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Its agents, one role each</text>
<text x="696" y="206" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Test author, builder, fixer, graders,</text>
<text x="696" y="223" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">second reviewer.</text>
<text x="696" y="243" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Tests run in Docker.</text>
<text x="696" y="263" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The deployer starts the product on</text>
<text x="696" y="280" text-anchor="start" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">this machine, as local copies.</text>
<line x1="318" y1="96" x2="348" y2="96" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="652" y1="96" x2="682" y2="96" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="318" y1="210" x2="348" y2="210" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="652" y1="210" x2="682" y2="210" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="682" y1="300" x2="652" y2="300" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="348" y1="300" x2="318" y2="300" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="16" y="352" width="968" height="40" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="500" y="377" text-anchor="middle" style="fill:#5a6875;font-size:13px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Both sides run on your machine. They meet only on GitHub. You talk to ViD, never to the dev side.</text>
</svg>
