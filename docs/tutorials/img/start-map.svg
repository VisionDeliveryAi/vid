<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 322" width="1000" height="322" role="img" aria-label="The same four moves in every mode, and the three modes that differ in who builds and where">
<rect x="0" y="0" width="1000" height="322" fill="#f6f7f8"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#0b5c7a"/></marker></defs>
<text x="16" y="18" text-anchor="start" style="fill:#5a6875;font-size:11.5px;font-weight:400;font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace">THE SAME IN EVERY MODE</text>
<line x1="16" y1="28" x2="984" y2="28" style="stroke:#16202a" stroke-width="1.5"/>
<rect x="16" y="40" width="230" height="92" rx="3" style="fill:#e2eff4;stroke:#0b5c7a" stroke-width="1"/>
<text x="28" y="63" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1. The spec</text>
<text x="28" y="83" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">You say what it must do. Every</text>
<text x="28" y="99" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">requirement has a fail-if.</text>
<line x1="248" y1="86" x2="259" y2="86" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="262" y="40" width="230" height="92" rx="3" style="fill:#e2eff4;stroke:#0b5c7a" stroke-width="1"/>
<text x="274" y="63" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2. The tests</text>
<text x="274" y="83" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Derived from the spec. You</text>
<text x="274" y="99" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">approve the list.</text>
<line x1="494" y1="86" x2="505" y2="86" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="508" y="40" width="230" height="92" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="520" y="63" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">3. The build</text>
<text x="520" y="83" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Until the tests pass. Each test</text>
<text x="520" y="99" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">seen to fail first.</text>
<line x1="740" y1="86" x2="751" y2="86" style="stroke:#0b5c7a" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="754" y="40" width="230" height="92" rx="3" style="fill:#e2eff4;stroke:#0b5c7a" stroke-width="1"/>
<text x="766" y="63" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">4. The review</text>
<text x="766" y="83" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Independent readers try to</text>
<text x="766" y="99" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">break it. You rule.</text>
<text x="16" y="166" text-anchor="start" style="fill:#5a6875;font-size:11.5px;font-weight:400;font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace">WHAT DIFFERS: WHO DOES STEP 3, AND WHERE</text>
<line x1="16" y1="176" x2="984" y2="176" style="stroke:#16202a" stroke-width="1.5"/>
<rect x="16" y="188" width="312" height="120" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="28" y="211" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Local auto</text>
<text x="28" y="231" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">ViD&#x27;s own agents build.</text>
<text x="28" y="250" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">On your machine, no GitHub.</text>
<text x="28" y="269" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">For one person or a small group.</text>
<rect x="344" y="188" width="312" height="120" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="356" y="211" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">GitHub auto</text>
<text x="356" y="231" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">ViD&#x27;s own agents build.</text>
<text x="356" y="250" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Through GitHub tickets and pull</text>
<text x="356" y="266" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">requests, in the open.</text>
<text x="356" y="285" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">For work others should be able to</text>
<text x="356" y="301" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">follow.</text>
<rect x="672" y="188" width="312" height="120" rx="3" style="fill:#ffffff;stroke:#d6dce2" stroke-width="1"/>
<text x="684" y="211" text-anchor="start" style="fill:#16202a;font-size:14px;font-weight:600;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">GitHub manual</text>
<text x="684" y="231" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Your own developers build.</text>
<text x="684" y="250" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Through GitHub tickets that ViD writes</text>
<text x="684" y="266" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">and checks.</text>
<text x="684" y="285" text-anchor="start" style="fill:#5a6875;font-size:12.5px;font-weight:400;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">For a team with its own tools.</text>
</svg>