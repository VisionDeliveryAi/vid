<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>JobDigest — save a search</title><link rel="stylesheet" href="../tokens.css"></head>
<body>
<section id="s01-default" data-screen="S01" data-state="default">
  <h1>JobDigest</h1>
  <form id="save-search-form" method="post">
    <label for="search-words">Search words</label> <input id="search-words" name="words" type="text">
    <label for="email">Email</label> <input id="email" name="email" type="email">
    <button id="save-search" type="submit">Save</button>
  </form>
</section>
<section id="s01-saved" data-screen="S01" data-state="saved">
  <h1>JobDigest</h1>
  <p id="saved-search">electrician</p>
  <p id="saved-address">pat@example.com</p>
  <p id="saved-note">Check your inbox to confirm</p>
</section>
</body></html>
